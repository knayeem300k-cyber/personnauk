<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merchandising Software, All Modules</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1eefb;--card:#f8f6ff;--ink:#241b3d;--mute:#7a7096;--ac:#7b2ff7;--ac2:#a77bff;--line:#e3ddf5;--ok:#1fa971;--wn:#e08a1e;--bd:#d6455d;--hi:#fff;--lo:rgba(120,90,200,.18);
--sh:9px 9px 22px var(--lo),-7px -7px 18px var(--hi);--in:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1530;--card:#211b3b;--ink:#efeafd;--mute:#a79dc9;--line:#322a55;--hi:rgba(255,255,255,.04);--lo:rgba(0,0,0,.45);--ac2:#b794ff}}
:root[data-theme="dark"]{--bg:#1a1530;--card:#211b3b;--ink:#efeafd;--mute:#a79dc9;--line:#322a55;--hi:rgba(255,255,255,.04);--lo:rgba(0,0,0,.45);--ac2:#b794ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px;padding:22px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:20px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.4px}h2{font-size:15px;margin:0 0 14px;font-weight:700}
.side{position:sticky;top:22px;height:calc(100vh - 44px);overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:4px;border-radius:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;padding:2px 8px 14px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center}
.side a{display:block;padding:10px 14px;border-radius:14px;color:var(--mute);text-decoration:none;font-weight:600;white-space:nowrap}
.side a:hover{box-shadow:var(--in)}
.side a.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 18px rgba(123,47,247,.35)}
.side a:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.top div{margin-right:auto}.top p{margin:2px 0 0;color:var(--mute)}
.btn{border:0;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));padding:12px 22px;border-radius:15px;box-shadow:0 10px 22px rgba(123,47,247,.35)}
.btn.g{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
.kp small{color:var(--mute);font-weight:600}.kp b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px;margin:2px 0}.kp span{font-size:12px;font-weight:600}
.ok{color:var(--ok)}.bd{color:var(--bd)}.wn{color:var(--wn)}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px;align-items:start}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:0 10px 10px}td{padding:11px 10px;border-top:1px solid var(--line);font-weight:500}td:first-child{font-weight:700}
.chip{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:rgba(31,169,113,.15);color:var(--ok)}.c-w{background:rgba(224,138,30,.16);color:var(--wn)}.c-b{background:rgba(214,69,93,.14);color:var(--bd)}.c-p{background:rgba(123,47,247,.14);color:var(--ac)}
.fl{display:flex;flex-direction:column;gap:10px}
.f{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg);box-shadow:var(--in)}
.f i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:800 12px system-ui;flex:none;font-style:normal}
.f .ok{background:var(--ok);color:#fff}.f .wt{background:var(--wn);color:#fff}.f .no{background:var(--line);color:var(--mute)}
.f b{flex:1;font-weight:600;font-size:13px}.f small{color:var(--mute);font-size:11.5px;text-align:right}
.br{display:grid;grid-template-columns:110px 1fr 40px;gap:12px;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:12px}
.br em{font-style:normal;color:var(--mute);text-align:right}
.bar{height:12px;border-radius:8px;background:var(--bg);box-shadow:var(--in);position:relative}.bar i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.pipe{display:flex;gap:12px;overflow-x:auto;padding:6px 6px 16px;margin:0 -6px}
.st{flex:0 0 118px;color:inherit;text-decoration:none;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px}
.st i{font-style:normal;font-size:11px;color:var(--mute);font-weight:600}.st strong{display:block;font-size:22px;font-weight:800}.st span{font-size:12px;font-weight:600;display:block;line-height:1.25}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:14px;gap:16px}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.brand{display:none}}
</style>
</head>
<body>
<div class="app">
<nav class="card side" id="nav" aria-label="Modules"><div class="brand"><span class="logo">M</span>Merchandiser</div></nav>
<main class="main" id="view"></main>
</div>
<script>
var C=function(t){var p=String(t).split("|");return p[1]?'<span class="chip c-'+p[1]+'">'+p[0]+'</span>':p[0]};
var KP=function(a){return '<section class="kp">'+a.map(function(k){return '<div class="card"><small>'+k[0]+'</small><b>'+k[1]+'</b><span class="'+(k[3]||'ok')+'">'+k[2]+'</span></div>'}).join("")+'</section>'};
var TB=function(t,h,r){return '<section class="card"><h2>'+t+'</h2><div class="tw"><table><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join("")+'</tr></thead><tbody>'+r.map(function(row){return '<tr>'+row.map(function(c){return '<td>'+C(c)+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div></section>'};
var CK=function(t,a){var s={ok:"✓",wt:"!",no:"–"};return '<section class="card"><h2>'+t+'</h2><div class="fl">'+a.map(function(x){return '<div class="f"><i class="'+x[2]+'">'+s[x[2]]+'</i><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'}).join("")+'</div></section>'};
var BR=function(t,a){return '<section class="card"><h2>'+t+'</h2>'+a.map(function(x){return '<div class="br">'+x[0]+'<div class="bar"><i style="width:'+x[1]+'%"></i></div><em>'+x[1]+'%</em></div>'}).join("")+'</section>'};
var PG=function(k,m,tb,side){return (k?KP(k):'')+'<div class="g2">'+tb+side+'</div>'};
var Pipe=function(){var n=[["Inquiry",7,"inquiry"],["Costing",5,"costing"],["Sampling",12,"sampling"],["PO and contract",4,"orders"],["Pre-production",9,"preprod"],["Production",6,"production"],["Follow-up",8,"production"],["Quality",3,"quality"],["Shipping",6,"shipping"],["Post-shipment",11,"payments"]];return '<section><h2>Order pipeline</h2><div class="pipe">'+n.map(function(x,i){return '<a class="st" href="#'+x[2]+'"><i>Stage '+(i+1)+'</i><strong>'+x[1]+'</strong><span>'+x[0]+'</span></a>'}).join("")+'</div></section>'};
var OKS=function(a){return a};
var M=[
["dashboard","Dashboard","Everything that needs you today",function(){return KP([["Active orders",48,"6 new this week"],["Samples waiting for buyer",12,"3 past due","bd"],["Shipping this week",6,"4 documents ready"],["Overdue tasks",5,"2 need action today","bd"]])+Pipe()+'<div class="g2">'+TB("Today’s briefing",["Update","Order","Stage"],[["Fit sample comments received","88217","Sampling|w"],["PO date differs from contract","88190","PO review|b"],["Lab dip approval due tomorrow","88162","Pre-production|p"],["Forwarder booking confirmed","88104","Shipping|ok"]])+CK("Shipments this month",[["88104, Alder Co.","Nov 22","wt"],["88071, Harbor and Pine","Nov 27","no"],["88059, Northwind","Dec 02","no"]])+'</div>'}],
["inquiry","1. Inquiry","Buyer requirement, target price and factory capability",function(){return PG(0,0,TB("Open inquiries",["Inquiry","Buyer","Style","Qty","Target price","Status"],[["INQ-311","Northwind Apparel","Polo shirt","24,000","$4.20","Quoted|ok"],["INQ-312","Alder Co.","Basic tee","40,000","$2.65","Costing|w"],["INQ-313","Harbor and Pine","Fleece hoodie","18,500","$7.90","New|p"],["INQ-314","Kestrel Wear","Chino pant","12,000","$6.10","Capacity check|w"]]),CK("Requirement checklist",[["Tech pack received","INQ-313","ok"],["Reference sample","Courier due","wt"],["Target price and quantity","Confirmed","ok"],["Factory capability sheet","Send to buyer","wt"]])).replace('<div class="g2">',KP([["New inquiries",7,"3 today"],["Quoted this month",21,"62% win rate"],["Waiting for tech pack",4,"2 reminders sent","wn"]])+'<div class="g2">')}],
["techpack","2. Tech Pack","Style details in one place",function(){return KP([["Tech packs",64,"9 updated this week"],["Missing sections",11,"4 styles affected","bd"],["Awaiting buyer revision",5,"Oldest 6 days","wn"]])+'<div class="g2">'+TB("Style library",["Style","Buyer","Version","Sections ready","Status"],[["LX-2041 Polo","Northwind","v3","7 of 7","Final|ok"],["KD-1190 Hoodie","Harbor and Pine","v2","6 of 7","Review|w"],["AL-0907 Tee","Alder Co.","v1","4 of 7","Draft|p"],["LX-2033 Chino","Northwind","v4","7 of 7","Final|ok"]])+CK("Sections in LX-2041",[["Design sketch","Front, back","ok"],["Measurement chart","S to XXL","ok"],["Fabric details","180 GSM pique","ok"],["Stitch details","Overlock, topstitch","ok"],["Trims and labels","Button, main label","ok"],["Label placement","Neck, hem","ok"],["Packing instruction","Polybag, 12 per carton","ok"]])+'</div>'}],
["costing","3. Costing and BOM","Price build-up and material list",function(){return KP([["Costing sheets",38,"5 awaiting approval","wn"],["Average FOB","$5.12","0.8% above last month","bd"],["Average margin","7.4%","Target 8%","wn"]])+'<div class="g2">'+TB("Costing sheets",["Style","Fabric","Trims","CM","Wastage","Profit","FOB"],[["LX-2041","$2.55","$0.62","$0.52","$0.21","$0.30","$4.20"],["AL-0907","$1.35","$0.21","$0.38","$0.09","$0.17","$2.65"],["KD-1190","$4.60","$0.95","$0.78","$0.30","$0.55","$7.90"],["LX-2033","$3.10","$0.74","$0.60","$0.24","$0.36","$6.10"]])+BR("Cost split for LX-2041",[["Fabric",61],["Trims",15],["CM",12],["Wastage",5],["Profit",7]])+'</div>'}],
["sampling","4. Sampling","Sample requests, comments and courier tracking",function(){return KP([["Samples in progress",12,"4 due this week"],["Waiting for buyer",7,"3 past due","bd"],["Approved this month",18,"Fit approval 74%"]])+'<div class="g2">'+TB("Sample tracker",["Order","Style","Type","Sent","AWB","Status"],[["88217","LX-2041","Fit","Nov 10","DHL 4420 18","Waiting|w"],["88190","KD-1190","PP","Nov 06","FedEx 8821 02","Approved|ok"],["88162","LX-2033","Size set","Oct 28","DHL 4419 77","Past due|b"],["88140","AL-0907","Proto","Nov 14","Not sent","In progress|p"]])+BR("Sample types in progress",[["Proto",20],["Fit",35],["Size set",15],["Salesman",5],["PP",20],["Shipment",5]])+'</div>'}],
["orders","5. Orders and PO","Confirmed orders, price and payment terms",function(){return KP([["Open POs",48,"Value $2.4M"],["Under review",4,"1 has a date conflict","bd"],["L/C pending",3,"Oldest 5 days","wn"]])+'<div class="g2">'+TB("Purchase orders",["PO","Buyer","Qty","Value","Delivery","Payment","Review"],[["88217","Northwind","24,000","$100.8K","Jan 18","L/C","Date conflict|b"],["88190","Harbor and Pine","18,500","$146.2K","Jan 30","TT 30 days","Clear|ok"],["88162","Northwind","12,000","$73.2K","Feb 06","L/C","Clear|ok"],["88140","Alder Co.","40,000","$106.0K","Feb 12","TT 45 days","Check price|w"]])+CK("PO review checks",[["Price matches quotation","88217","ok"],["Delivery date matches contract","88217","wt"],["Packing and label terms","88217","ok"],["Payment term and L/C","88217","ok"]])+'</div>'}],
["preprod","6. Pre-production","Booking, approvals and planning",function(){return KP([["Orders in planning",9,"3 booking late","wn"],["Approvals pending",14,"Lab dip 6","wn"],["PP meetings this week",3,"Next: Tue 10:00"]])+'<div class="g2">'+TB("Booking and approvals for 88217",["Item","Supplier","Booked","Status"],[["Fabric, 180 GSM pique","Rahim Textile","Nov 08","In house|ok"],["Buttons and labels","Trims Hub","Nov 09","Awaiting|w"],["Lab dip, navy","Rahim Textile","Nov 12","Review|w"],["Embroidery strike-off","Star Emb.","Nov 13","Approved|ok"],["Fabric test report","Lab Dhaka","Nov 14","Failed shrinkage|b"]])+CK("Approval checklist",[["T&A calendar","Updated","ok"],["Lab dip","Waiting","wt"],["Strike-off and print","Approved","ok"],["Wash approval","Not started","no"],["Back-to-back L/C","Sent to bank","wt"],["PP meeting minutes","Tuesday","no"]])+'</div>'}],
["production","7. Production","Daily output, line loading and follow-up",function(){return KP([["Today’s output","8,420","92% of target"],["Average DHU","2.8%","Target 2.5%","wn"],["Orders running",6,"1 behind plan","bd"]])+'<div class="g2">'+TB("Line status today",["Line","Order","Target","Actual","DHU","Status"],[["Line 4","88190","1,400","1,310","2.1%","On track|ok"],["Line 7","88162","1,200","980","3.9%","Behind|b"],["Line 9","88217","1,100","1,090","2.4%","On track|ok"],["Cutting","88140","6,000","5,800","–","On track|ok"]])+CK("Material in house",[["Main fabric, 88217","100%","ok"],["Trims, 88217","60%","wt"],["Poly bags and cartons","Ordered","wt"],["Elastic, 88162","Delayed 4 days","no"]])+'</div>'}],
["quality","8. Quality","Inspection and corrective action",function(){return KP([["Inspections this month",19,"16 passed"],["Failed",3,"2 CAPs open","bd"],["Pass rate","84%","Up from 79%"]])+'<div class="g2">'+TB("Inspections",["Order","Type","AQL","Inspector","Result"],[["88104","Final","2.5","SGS","Passed|ok"],["88071","Final","2.5","Intertek","Passed|ok"],["88162","In-line","2.5","Internal","Failed|b"],["88217","Pre-final","2.5","Bureau Veritas","Scheduled|p"]])+CK("Open actions",[["CAP for 88162","Due Nov 19","wt"],["Metal detection report","88104","ok"],["Final garment test report","88071","ok"],["Re-inspection booking","88162","no"]])+'</div>'}],
["shipping","9. Shipping and documents","Booking, shipping papers and customs",function(){return KP([["Shipments this month",6,"2 by air"],["Documents complete","78%","3 missing","wn"],["On water now",2,"ETA Dec 05"]])+'<div class="g2">'+TB("Shipments",["Order","Mode","Forwarder","Ship date","Documents"],[["88104","Sea","Apex","Nov 22","8 of 8|ok"],["88071","Sea","Apex","Nov 27","6 of 8|w"],["88059","Air","SkyLink","Dec 02","3 of 8|b"],["88033","Sea","Oriental","Dec 09","1 of 8|p"]])+CK("Documents for 88071",[["Packing list","Ready","ok"],["Commercial invoice","Ready","ok"],["Booking confirmation","Ready","ok"],["Bill of lading","After sailing","no"],["EXP form","Waiting","wt"],["Certificate of origin","Waiting","wt"],["UD from BGMEA","Applied","wt"],["Inspection certificate","Ready","ok"]])+'</div>'}],
["payments","10. Payments and closing","Collect payment and close the order file",function(){return KP([["Outstanding","$412K","3 orders","wn"],["Overdue payments","$58K","1 order","bd"],["Orders closed this month",11,"All files complete"]])+'<div class="g2">'+TB("Payment tracking",["Order","Buyer","Invoice","Due date","Paid","Status"],[["88104","Alder Co.","$106.0K","Dec 20","$0","Not due|p"],["87990","Northwind","$98.4K","Nov 05","$40K","Overdue|b"],["87952","Harbor and Pine","$146.2K","Nov 25","$0","Due soon|w"],["87911","Alder Co.","$73.0K","Oct 30","$73.0K","Paid|ok"]])+CK("Order closing file, 87911",[["Shipment summary","Done","ok"],["Buyer feedback","Received","ok"],["Claims report","None","ok"],["Final cost versus quote","Review","wt"],["File archived","Pending","no"]])+'</div>'}]
];
var nav=document.getElementById("nav"),view=document.getElementById("view");
M.forEach(function(m){var a=document.createElement("a");a.href="#"+m[0];a.textContent=m[1];a.dataset.id=m[0];nav.appendChild(a)});
function show(){var id=(location.hash||"#dashboard").slice(1),m=M.filter(function(x){return x[0]===id})[0]||M[0];
view.innerHTML='<header class="top"><div><h1>'+m[1]+'</h1><p>'+m[2]+'</p></div><button class="btn g">Filter</button><button class="btn">New</button></header>'+m[3]();
[].forEach.call(nav.querySelectorAll("a"),function(a){a.classList.toggle("on",a.dataset.id===m[0])});}
addEventListener("hashchange",show);show();
</script>
</body>
</html>
