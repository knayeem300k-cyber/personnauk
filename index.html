<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merchandising Software, All Modules</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f1eefb;--card:#f8f6ff;--ink:#241b3d;--mute:#7a7096;--ac:#7b2ff7;--ac2:#a77bff;--line:#e3ddf5;--ok:#1fa971;--wn:#e08a1e;--bd:#d6455d;--hi:#fff;--lo:rgba(120,90,200,.18);
--sh:9px 9px 22px var(--lo),-7px -7px 18px var(--hi);--in:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1530;--card:#211b3b;--ink:#efeafd;--mute:#a79dc9;--line:#322a55;--hi:rgba(255,255,255,.04);--lo:rgba(0,0,0,.45);--ac2:#b794ff}}
:root[data-theme="dark"]{--bg:#1a1530;--card:#211b3b;--ink:#efeafd;--mute:#a79dc9;--line:#322a55;--hi:rgba(255,255,255,.04);--lo:rgba(0,0,0,.45);--ac2:#b794ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:26px;padding:22px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:20px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.4px}h2{font-size:15px;margin:0 0 14px;font-weight:700}
.side{position:sticky;top:22px;height:calc(100vh - 44px);overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:4px;border-radius:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;padding:2px 8px 14px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center}
.side a{display:block;padding:10px 14px;border-radius:14px;color:var(--mute);text-decoration:none;font-weight:600;white-space:nowrap}
.side a:hover{box-shadow:var(--in)}
.side a.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 18px rgba(123,47,247,.35)}
.side a:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.main{display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.top div{margin-right:auto}.top p{margin:2px 0 0;color:var(--mute)}
.btn{border:0;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));padding:12px 22px;border-radius:15px;box-shadow:0 10px 22px rgba(123,47,247,.35)}
.btn.g{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px}
.kp small{color:var(--mute);font-weight:600}.kp b{display:block;font-size:28px;font-weight:800;letter-spacing:-1px;margin:2px 0}.kp span{font-size:12px;font-weight:600}
.ok{color:var(--ok)}.bd{color:var(--bd)}.wn{color:var(--wn)}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:22px;align-items:start}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:0 10px 10px}td{padding:11px 10px;border-top:1px solid var(--line);font-weight:500}td:first-child{font-weight:700}
.chip{display:inline-block;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.c-ok{background:rgba(31,169,113,.15);color:var(--ok)}.c-w{background:rgba(224,138,30,.16);color:var(--wn)}.c-b{background:rgba(214,69,93,.14);color:var(--bd)}.c-p{background:rgba(123,47,247,.14);color:var(--ac)}
.fl{display:flex;flex-direction:column;gap:10px}
.f{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg);box-shadow:var(--in)}
.f i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:800 12px system-ui;flex:none;font-style:normal}
.f .ok{background:var(--ok);color:#fff}.f .wt{background:var(--wn);color:#fff}.f .no{background:var(--line);color:var(--mute)}
.f b{flex:1;font-weight:600;font-size:13px}.f small{color:var(--mute);font-size:11.5px;text-align:right}
.br{display:grid;grid-template-columns:110px 1fr 40px;gap:12px;align-items:center;font-size:12.5px;font-weight:600;margin-bottom:12px}
.br em{font-style:normal;color:var(--mute);text-align:right}
.bar{height:12px;border-radius:8px;background:var(--bg);box-shadow:var(--in);position:relative}.bar i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.pipe{display:flex;gap:12px;overflow-x:auto;padding:6px 6px 16px;margin:0 -6px}
.st{flex:0 0 118px;color:inherit;text-decoration:none;background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px}
.st i{font-style:normal;font-size:11px;color:var(--mute);font-weight:600}.st strong{display:block;font-size:22px;font-weight:800}.st span{font-size:12px;font-weight:600;display:block;line-height:1.25}
.ai{border-radius:26px;min-height:calc(100vh - 150px);padding:26px clamp(16px,4vw,48px);color:#f1ebff;display:flex;flex-direction:column;background:radial-gradient(70% 50% at 70% 5%,#7b4fd6 0,transparent 70%),radial-gradient(60% 45% at 10% 100%,#5a2f9c 0,transparent 70%),linear-gradient(180deg,#2b1952,#190f30);border:1px solid rgba(255,255,255,.12);box-shadow:var(--sh)}
.ai .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;max-width:800px;margin:0 auto;padding:10px 0}
.ai .h{display:flex;flex-direction:column;align-items:center;text-align:center}
.ai .orb{width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9d6ff,#8a4dff 45%,#2a1166 85%);box-shadow:0 0 50px rgba(155,77,255,.7),inset -6px -8px 16px rgba(20,5,60,.6);margin-bottom:18px}
.ai h2{margin:0;font-size:clamp(22px,3vw,32px);font-weight:500;letter-spacing:-.4px}
.ai .h p{margin:8px 0 0;color:#b4a6d6;max-width:46ch}
.ai .chp,.ai .bx,.ai .cds{width:100%;max-width:800px;margin-left:auto;margin-right:auto}
.ai .chp{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;margin-bottom:12px}
.ai .chp button{display:inline-flex;gap:8px;align-items:center;padding:9px 16px;border-radius:20px;background:rgba(10,5,22,.5);border:1px solid rgba(255,255,255,.16);color:#f1ebff;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.ai .bx{border-radius:22px;padding:16px;background:rgba(10,5,22,.5);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 0 30px rgba(155,77,255,.08)}
.ai .q{display:flex;gap:10px;color:#b4a6d6;min-height:56px}.ai .q .ic{color:#c38bff;margin-top:2px}
.ai .tl{display:flex;align-items:center;gap:4px;color:#b4a6d6;flex-wrap:wrap}
.ai .tl button{display:flex;gap:7px;align-items:center;border:0;background:none;color:inherit;font:inherit;padding:6px 8px;border-radius:10px;cursor:pointer}
.ai .tl i{width:1px;height:18px;background:rgba(255,255,255,.18)}
.ai .rt{margin-left:auto;display:flex;gap:8px}
.ai .tl .r{width:36px;height:36px;border-radius:50%;justify-content:center;padding:0;background:rgba(255,255,255,.1);color:#f1ebff}
.ai .tl .r.go{background:linear-gradient(135deg,#9b4dff,#6f2ee0);box-shadow:0 6px 18px rgba(155,77,255,.5)}
.ai .cds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.ai .cd{padding:14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)}
.ai .cd .t{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-weight:700}
.ai .cd .t span{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.ai .cd .t em{margin-left:auto;font-style:normal;font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.1);color:#b4a6d6}
.ai .cd p{margin:0;color:#b4a6d6;font-size:12.5px}
.ai .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ai .cv{display:none;flex-direction:column;gap:16px;width:100%}
.ai[data-v=chat] .h,.ai[data-v=chat] .chp,.ai[data-v=chat] .cds{display:none}
.ai[data-v=chat] .cv{display:flex}
.ai .um{align-self:flex-end;max-width:80%;padding:12px 16px;border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#9b4dff,#6f2ee0)}
.ai .um small{display:flex;gap:6px;align-items:center;margin-top:8px;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.22);width:fit-content;font-weight:600}
.ai .am{padding:14px 16px;border-radius:4px 18px 18px 18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);max-width:92%}
.ai .am p{margin:0 0 10px}.ai .am p:last-child{margin:0}
.ai .kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:8px 0 12px;padding:12px 14px;border-radius:14px;background:rgba(10,5,22,.5);font-size:13px}
.ai .kv span{color:#b4a6d6}
.ai .wn{color:#ffc46b}.ai .gd{color:#43d6a0}
.ai .ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ai .ac button{border:0;font:inherit;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#9b4dff,#6f2ee0);padding:9px 16px;border-radius:12px}
.ai .ac button.g{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16)}
.ai .nw{align-self:center;border:1px solid rgba(255,255,255,.16);background:none;color:#b4a6d6;font:inherit;padding:7px 16px;border-radius:20px;cursor:pointer}
@media(max-width:820px){.ai .cds{grid-template-columns:1fr}.ai .kv{grid-template-columns:100px 1fr}}
.ai{background:var(--card);border:0;box-shadow:var(--sh);color:var(--ink)}
.ai .h p,.ai .q,.ai .tl,.ai .kv span,.ai .cd p,.ai .nw{color:var(--mute)}
.ai .orb{background:radial-gradient(circle at 35% 30%,#fff,#c9a6ff 45%,var(--ac));box-shadow:0 14px 36px rgba(123,47,247,.45),inset -6px -8px 16px rgba(60,10,140,.3)}
.ai .chp button{background:var(--card);border:0;box-shadow:var(--sh);color:var(--ink)}
.ai .bx{background:var(--bg);border:0;box-shadow:var(--in)}
.ai .q .ic{color:var(--ac)}
.ai .tl i{background:var(--line)}
.ai .tl button:hover{color:var(--ink)}
.ai .tl .r{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.ai .tl .r.go{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 18px rgba(123,47,247,.35)}
.ai .cd{background:var(--card);border:0;box-shadow:var(--sh)}
.ai .cd .t span{background:var(--bg);box-shadow:var(--in);color:var(--ac)}
.ai .cd .t em{background:var(--bg);color:var(--mute)}
.ai .um{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 18px rgba(123,47,247,.25)}
.ai .um small{background:rgba(255,255,255,.22)}
.ai .am{background:var(--bg);border:0;box-shadow:var(--in)}
.ai .kv{background:var(--card);box-shadow:var(--sh)}
.ai .wn{color:var(--wn)}.ai .gd{color:var(--ok)}
.ai .ac button{background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 18px rgba(123,47,247,.3)}
.ai .ac button.g{background:var(--card);color:var(--ink);border:0;box-shadow:var(--sh)}
.ai .nw{background:var(--card);border:0;box-shadow:var(--sh)}
@media(max-width:1000px){.g2{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:14px;gap:16px}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.brand{display:none}}
</style>
